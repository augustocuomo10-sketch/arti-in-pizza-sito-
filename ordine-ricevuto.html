<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/styles.css?v=202608211115">
<script src="assets/js/consenso.js?v=202608211115"></script>
<script src="assets/js/ordine-corso.js?v=202608211115" defer></script>

<!-- Icona del sito -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icone/icona-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/icone/icona-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0F2C46">
</head>
<body>
<a href="#main" class="visually-hidden">Vai al contenuto</a>

<header class="site-header texture-band">
  <div class="wrap bar">
    <a class="brandmark" href="index.html"><img class="brand-logo" src="assets/img/logo.png" alt="Arti in Pizza, dal 1997"></a>
    <div class="header-actions">
      <a class="btn btn-order" href="menu.html">Torna al menù</a>
    </div>
  </div>
</header>

<main id="main">
  <section class="hero" style="padding-bottom:20px;">
    <div class="wrap">
      <div id="esito" class="esito-ordine" aria-live="polite">
        <p class="lede">Stiamo verificando il pagamento…</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer texture-band">
  <div class="wrap">
    <div class="bottom"><span>© 2026 Arti in Pizza di Cuomo Vincenzo — 031 300809</span>
      <span><a href="privacy.html">Privacy</a> · <a href="cookie.html">Cookie</a> · <a href="condizioni-di-vendita.html">Condizioni di vendita</a> · P. IVA 02288400134</span></div>
  </div>
</footer>

<script>
// Lo stato del pagamento non si deduce dal fatto di essere atterrati qui:
// si chiede al server, che a sua volta lo chiede a SumUp.
(function () {
  var API = "https://bitter-firefly-4508.augusto-cuomo10.workers.dev"; // stesso valore di CFG.apiPagamenti in assets/js/carrello.js
  var box = document.getElementById("esito");
  var rif = new URLSearchParams(location.search).get("ref") || "";

  function mostra(titolo, testo, classe) {
    box.className = "esito-ordine " + (classe || "");
    box.innerHTML = "<h1>" + titolo + "</h1><p class='lede'>" + testo + "</p>" +
      "<div class='btn-row'>" +
      (rif ? "<a class='btn btn-primary' href='segui-ordine.html?ref=" + encodeURIComponent(rif) +
             "'>Segui il tuo ordine</a>" : "") +
      "<a class='btn btn-outline' href='tel:031300809'>Chiamaci: 031 300809</a></div>" +
      (rif ? "<p style='font-size:13.5px;color:var(--ink-soft);margin-top:14px;'>" +
             "Salva questo link fra i preferiti: ti mostra a che punto è il tuo ordine, " +
             "senza doverci chiamare.</p>" : "");
  }

  if (!rif) {
    mostra("Ordine non identificato",
      "Non troviamo il riferimento dell'ordine. Se hai pagato, chiamaci: controlliamo subito.", "attenzione");
    return;
  }
  // ordine in contanti: non c'e' pagamento da verificare, e' gia' registrato
  if (new URLSearchParams(location.search).get("modo") === "contanti") {
    mostra("Ordine inviato",
      "L'abbiamo ricevuto, riferimento <strong>" + rif + "</strong>. " +
      "Ti chiamiamo noi per confermare i tempi. Si paga <strong>in contanti</strong> alla consegna o al ritiro.", "riuscito");
    return;
  }

  if (!API) {
    mostra("Ordine registrato",
      "Riferimento <strong>" + rif + "</strong>. Ti confermiamo noi tempi e disponibilità.", "");
    return;
  }

  fetch(API + "/stato?ref=" + encodeURIComponent(rif))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.pagato) {
        mostra("Pagamento riuscito",
          "Grazie! Abbiamo ricevuto il tuo ordine <strong>" + rif + "</strong> per " +
          String(d.totale).replace(".", ",") + " €. Ti chiamiamo noi per confermare i tempi.", "riuscito");
      } else if (d.stato === "importo_discordante") {
        mostra("Verifica in corso",
          "Il pagamento risulta eseguito ma l'importo non corrisponde al nostro conteggio. " +
          "Non addebitiamo nulla finché non abbiamo controllato: chiamaci allo 031 300809.", "attenzione");
      } else {
        mostra("Pagamento non ancora confermato",
          "Non risulta ancora completato. Se pensi di aver pagato, chiamaci con il riferimento <strong>" +
          rif + "</strong>.", "attenzione");
      }
    })
    .catch(function () {
      mostra("Non riusciamo a verificare ora",
        "Riferimento <strong>" + rif + "</strong>. Chiamaci allo 031 300809 e controlliamo insieme.", "attenzione");
    });
})();
</script>
</body>
</html>
